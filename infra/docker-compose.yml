services:
  postgres:
    image: postgres:16
    container_name: getemployed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: getemployed
      POSTGRES_USER: getemployed
      POSTGRES_PASSWORD: getemployed
    ports:
      - "5433:5432"
    volumes:
      - getemployed_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getemployed -d getemployed"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  getemployed_pgdata: