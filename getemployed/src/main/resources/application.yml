server:
  port: 8080

spring:
  config:
    import: optional:file:.env

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/getemployed}
    username: ${DB_USERNAME:getemployed}
    password: ${DB_PASSWORD:getemployed}

  mail:
    host: smtp.mail.ru
    port: 465
    username: getemployedemailsender@mail.ru
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          debug: true
          ssl:
            enable: true
            trust: smtp.mail.ru



  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: email-service
      auto-offset-reset: earliest
    topics:
      email-event: email-event
      password-reset-event: password-reset-event

    bootstrap-servers: localhost:9094


  data:
    redis:
      port: 6379

  ai:
    model:
      chat: ollama
    ollama:
      # Spring on host -> http://localhost:11434. Spring in docker compose -> OLLAMA_BASE_URL=http://ollama:11434
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}
          temperature: 0.2
          num-ctx: 4096
          num-predict: 900





superjob:
  # Get your API key at https://api.superjob.ru — register an app, use the client_secret value
  api-key: ${SUPERJOB_API_KEY:}

hh:
  client-id: ${HH_CLIENT_ID:}
  client-secret: ${HH_CLIENT_SECRET:}

app:
  ai:
    trajectory-timeout-seconds: ${OLLAMA_TRAJECTORY_TIMEOUT_SECONDS:60}
  frontend:
    url: http://localhost:8080
    home-page-url: http://localhost:8080/?verify=success
    verify-failed-url: http://localhost:8080/?verify=failed
    verify-url-pattern: http://localhost:8080/api/v1/verify?token=%s
    reset-url-pattern: http://localhost:8080/?resetToken=%s
  security:
    email-token-pepper: ${EMAIL_TOKEN_PEPPER}
    email-token-ttl-minutes: 30
  verify:
    base-url: http://localhost:8080
    token-ttl-minutes: 60

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml


jwt:
  secret: ${JWT_SECRET}
  ttl-minutes: 60
