spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/getemployed
    username: getemployed
    password: getemployed

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    org:
      springframework:
        aop: DEBUG
        beans:
          factory:
            support: INFO
        web: DEBUG


server:
  error:
    include-message: always
    include-stacktrace: always

  port: 8080


jwt:
  secret: "getemployed"
  ttl-minutes: 60

