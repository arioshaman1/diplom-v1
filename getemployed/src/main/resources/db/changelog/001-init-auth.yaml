databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: diploma
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints: { nullable: false, unique: true }
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints: { nullable: false }

  - changeSet:
      id: 002-create-roles
      author: diploma
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints: { nullable: false, unique: true }

  - changeSet:
      id: 003-create-user-roles
      author: diploma
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: role_id
                  type: BIGINT
                  constraints: { nullable: false }

        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role_id
            constraintName: pk_user_roles

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_role

  - changeSet:
      id: 004-insert-default-roles
      author: diploma
      changes:
        - insert:
            tableName: roles
            columns:
              - column: { name: name, value: ROLE_USER }
        - insert:
            tableName: roles
            columns:
              - column: { name: name, value: ROLE_ADMIN }

  - changeSet:
      id: 005-update-users-enabled-default
      author: diploma
      changes:
        - dropDefaultValue:
            tableName: users
            columnName: enabled
            columnDataType: BOOLEAN
        - addDefaultValue:
            tableName: users
            columnName: enabled
            defaultValueBoolean: false

  - changeSet:
      id: 006-create-email-verification-tokens
      author: diploma
      changes:
        - createTable:
            tableName: email_verification_tokens
            columns:
             - column:
                name: id
                type: BIGSERIAL
                constraints:
                  primaryKey: true
                  nullable: false
             - column:
                 name: user_id
                 type: BIGINT
                 constraints:
                   nullable: false
             - column:
                 name: token_hash
                 type: VARCHAR(255)
                 constraints:
                   nullable: false
                   unique: true
             - column:
                 name: expires_at
                 type: TIMESTAMP
                 constraints:
                   nullable: false

             - column:
                 name: used_at
                 type: TIMESTAMP

             - column:
                 name: created_at
                 type: TIMESTAMP
                 defaultValueComputed: now()
                 constraints:
                   nullable: false

        - addForeignKeyConstraint:
            baseTableName: email_verification_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_evt_user
  - changeSet:
      id: 007-add-revoked-at-to-email-verification-tokens
      author: diploma
      changes:
        - addColumn:
            tableName: email_verification_tokens
            columns:
              - column:
                  name: revoked_at
                  type: TIMESTAMP

  - changeSet:
      id: 008-create-refresh-tokens
      author: diploma
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: users_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: TIMESTAMP
              - column:
                  name: replaced_by_hash
                  type: VARCHAR(255)

  - changeSet:
      id: 009-create-password-reset-tokens
      author: diploma
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: used_at
                  type: TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: password_reset_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_prt_user

  - changeSet:
      id: 010-create-profiles
      author: diploma
      changes:
        - createTable:
            tableName: profiles
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: user_id
                  type: BIGINT
                  constraints: { nullable: false, unique: true }
              - column:
                  name: goal
                  type: VARCHAR(255)
              - column:
                  name: level
                  type: VARCHAR(50)
              - column:
                  name: city
                  type: VARCHAR(100)
              - column:
                  name: area_id
                  type: INT
              - column:
                  name: salary_min
                  type: INT
              - column:
                  name: salary_max
                  type: INT
              - column:
                  name: remote
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: onboarding_complete
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()

        - addForeignKeyConstraint:
            baseTableName: profiles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_profiles_user

  - changeSet:
      id: 011-create-skills
      author: diploma
      changes:
        - createTable:
            tableName: skills
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints: { nullable: false, unique: true }
              - column:
                  name: category
                  type: VARCHAR(100)
              - column:
                  name: popularity
                  type: DECIMAL(5, 2)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()

  - changeSet:
      id: 012-create-user-skills
      author: diploma
      changes:
        - createTable:
            tableName: user_skills
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: user_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: skill_id
                  type: INT
                  constraints: { nullable: false }
              - column:
                  name: level
                  type: SMALLINT
              - column:
                  name: verified
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()

        - addForeignKeyConstraint:
            baseTableName: user_skills
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_skills_user
        - addForeignKeyConstraint:
            baseTableName: user_skills
            baseColumnNames: skill_id
            referencedTableName: skills
            referencedColumnNames: id
            constraintName: fk_user_skills_skill