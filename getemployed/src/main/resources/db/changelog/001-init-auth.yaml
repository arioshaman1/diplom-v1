databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: diploma
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints: { nullable: false, unique: true }
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints: { nullable: false }

  - changeSet:
      id: 002-create-roles
      author: diploma
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints: { nullable: false, unique: true }

  - changeSet:
      id: 003-create-user-roles
      author: diploma
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: role_id
                  type: BIGINT
                  constraints: { nullable: false }

        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role_id
            constraintName: pk_user_roles

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_role

  - changeSet:
      id: 004-insert-default-roles
      author: diploma
      changes:
        - insert:
            tableName: roles
            columns:
              - column: { name: name, value: ROLE_USER }
        - insert:
            tableName: roles
            columns:
              - column: { name: name, value: ROLE_ADMIN }
