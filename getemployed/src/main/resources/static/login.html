<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - GetEmployed</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a href="/" class="logo">Get<span>Employed</span></a>
        <div class="nav-links">
            <a href="/">На главную</a>
            <a href="/register.html">Регистрация</a>
        </div>
        <button class="menu-toggle">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</nav>

<div class="auth-container">
    <div class="auth-box">
        <h2>Вход в систему</h2>

        <div id="message" class="message" style="display: none;"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required
                       placeholder="Ваш email">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required
                       placeholder="Ваш пароль">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Войти
            </button>
        </form>

        <div class="auth-link">
            Нет аккаунта? <a href="/register.html">Зарегистрироваться</a>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
    // Мобильное меню
    document.querySelector('.menu-toggle').addEventListener('click', function() {
        document.querySelector('.nav-links').classList.toggle('show');
    });

    // Обработка формы входа
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const messageDiv = document.getElementById('message');
        messageDiv.style.display = 'none';

        try {
            // Временно используем базовую аутентификацию
            await auth.login(email, password);

            showMessage('Вход успешен!', 'success');
            setTimeout(() => {
                window.location.href = '/dashboard.html';
            }, 1000);

        } catch (error) {
            showMessage(error.message || 'Ошибка входа', 'error');
        }
    });

    function showMessage(text, type) {
        const messageDiv = document.getElementById('message');
        messageDiv.textContent = text;
        messageDiv.className = `message ${type}`;
        messageDiv.style.display = 'block';
    }
</script>
</body>
</html>
